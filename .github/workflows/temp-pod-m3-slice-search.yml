name: temp-pod-m3-slice-search
on:
  push:
    paths:
      - '.github/workflows/temp-pod-m3-slice-search.yml'
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . matplotlib
      - name: Search validation slices
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY' | tee examples/pod_m3_slice_search_results.txt
          import sys
          sys.path.insert(0,'examples')
          import numpy as np
          from popsregression import POPSRegression, POPSRegressionEllipse
          import example_burgers as burgers
          import example_burgers_pod as ep

          mean_field,modes,_,_=ep.build_pod_basis(rank=2,n_basis_cases=48,seed=1001)
          train=burgers.draw_cases(np.random.default_rng(1),80)
          val=burgers.draw_cases(np.random.default_rng(31415),160)
          m=3; spatial_seed=4432

          def fit(n):
              X,r=ep.simulate_cases(train[:n],modes,mean_field,points_per_case=m,
                                    random_x=True,seed=spatial_seed)
              hy=POPSRegression(minimum_relative_error=0.0,posterior='hypercube').fit(X,r)
              el=POPSRegressionEllipse(random_state=1).fit(X,r)
              pa=POPSRegressionEllipse(random_state=1,pac_bayes=True).fit(X,r)
              return hy,el,pa

          lo=fit(8); hi=fit(80)
          def cov(y,a,b): return float(np.mean((y>=a)&(y<=b)))
          rows=[]
          for i,theta in enumerate(val):
              x,Xs,off,truth=ep.slice_design(theta,modes,mean_field)
              target=truth-off
              vals=[]
              for hy,el,pa in (lo,hi):
                  _,_,hhi,hlo=hy.predict(Xs,return_std=True,return_bounds=True)
                  _,ehi,elo=el.predict(Xs,return_bounds=True)
                  _,phi,plo=pa.predict(Xs,return_bounds=True)
                  vals.append((cov(target,hlo,hhi),cov(target,elo,ehi),cov(target,plo,phi)))
              (hl,elc,pl),(hh,eh,ph)=vals
              rescue=pl-elc
              # Prefer a large low-N PAC rescue, good PAC coverage, and convergence at high N.
              score = 4.0*rescue + 1.5*pl + 0.5*(eh+ph) - 3.0*max(0,0.90-pl) - 3.0*max(0,0.95-eh)
              rows.append((score,i,*theta,hl,elc,pl,hh,eh,ph))
          rows.sort(reverse=True)
          print('score idx nu A t | low H E P | high H E P')
          for r in rows[:25]: print(r)
          print('CHOSEN',rows[0])
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/pod_m3_slice_search_results.txt
          git commit -m 'temp: record m3 slice search results' || exit 0
          git push
