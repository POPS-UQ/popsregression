name: temp-pod-m3-figure
on:
  push:
    paths:
      - '.github/workflows/temp-pod-m3-figure.yml'
permissions:
  contents: write
jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . matplotlib
      - name: Generate figure
        env:
          MPLBACKEND: Agg
        run: |
          python examples/example_burgers_pod.py | tee pod_m3_figure_output.txt
          mkdir -p examples/generated
          mv example_burgers_pod_randomx_r2_m3_s4432.png examples/generated/
          mv example_burgers_pod_randomx_r2_m3_s4432.pdf examples/generated/
          mv pod_m3_figure_output.txt examples/generated/
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/generated/example_burgers_pod_randomx_r2_m3_s4432.png \
                  examples/generated/example_burgers_pod_randomx_r2_m3_s4432.pdf \
                  examples/generated/pod_m3_figure_output.txt
          git commit -m 'temp: record m3 POD figure output' || exit 0
          git push
