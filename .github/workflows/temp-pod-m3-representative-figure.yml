name: temp-pod-m3-representative-figure
on:
  push:
    paths:
      - '.github/workflows/temp-pod-m3-representative-figure.yml'
permissions:
  contents: write
jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . matplotlib
      - name: Generate representative validation-slice figure
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY' | tee m3_representative_output.txt
          import sys, os
          sys.path.insert(0,'examples')
          import example_burgers_pod as ep

          theta = (0.026179184158182815, 1.2192922639409096, 0.3425375070425021)
          original_slice_design = ep.slice_design
          def representative_slice(_theta, modes, mean_field):
              return original_slice_design(theta, modes, mean_field)
          ep.slice_design = representative_slice
          ep.run(points_per_case=3, spatial_seed=4432, n_test_cases=120, test_seed=27182)
          old = 'example_burgers_pod_randomx_r2_m3_s4432'
          new = 'example_burgers_pod_m3_representative'
          os.rename(old + '.png', new + '.png')
          os.rename(old + '.pdf', new + '.pdf')
          print('DISPLAY_THETA', theta)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: burgers-pod-m3-representative
          path: |
            example_burgers_pod_m3_representative.png
            example_burgers_pod_m3_representative.pdf
            m3_representative_output.txt
      - name: Record run id
        run: echo '${{ github.run_id }}' > examples/m3_representative_run_id.txt
      - name: Commit run id
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/m3_representative_run_id.txt
          git commit -m 'temp: record representative m3 artifact run id' || exit 0
          git push
