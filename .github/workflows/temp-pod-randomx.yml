name: temp-pod-randomx
on:
  push:
    paths:
      - '.github/workflows/temp-pod-randomx.yml'
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . matplotlib
      - name: Sweep
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'examples')
          import numpy as np
          from sklearn.linear_model import BayesianRidge
          from popsregression import POPSRegression, POPSRegressionEllipse
          import example_burgers as burgers
          import example_burgers_pod as ep

          ep.POD_NU_RANGE=(0.055,0.08); ep.POD_T_RANGE=(0.15,0.35)
          mean_field,modes,_,energy=ep.build_pod_basis(rank=2,n_basis_cases=48,seed=1001)
          rng=np.random.default_rng(1)
          train=burgers.draw_cases(rng,80); test=burgers.draw_cases(rng,80)
          Xt,rt=ep.simulate_cases(test,modes,mean_field,points_per_case=16)
          theta=(0.014,1.15,0.78)
          x,Xs,off,truth=ep.slice_design(theta,modes,mean_field); target=truth-off
          grid=np.linspace(0,2*np.pi,ep.N_GRID,endpoint=False)

          def cov(y,lo,hi): return np.mean((y>=lo)&(y<=hi))
          def sim_random(cases,ppc,seed):
              rr=np.random.default_rng(seed)
              rows=[]; vals=[]
              for nu,amp,time in cases:
                  _,u=burgers.burgers_solution(nu,amp,time)
                  idx=np.sort(rr.choice(ep.N_GRID,size=ppc,replace=False)); xx=grid[idx]
                  rows.append(ep.rom_features(np.full(ppc,nu),np.full(ppc,amp),np.full(ppc,time),xx,modes))
                  vals.append(u[idx]-ep.periodic_interp(mean_field,xx))
              return np.vstack(rows),np.concatenate(vals)

          for ppc in (4,6,8):
              print(f'\n### random x, ppc={ppc}, PODenergy={energy[1]:.6f}')
              for n in (8,80):
                  X,r=sim_random(train[:n],ppc,seed=2000+n+ppc)
                  br=BayesianRidge(fit_intercept=False).fit(X,r)
                  hy=POPSRegression(minimum_relative_error=0.0,posterior='hypercube').fit(X,r)
                  el=POPSRegressionEllipse(random_state=1).fit(X,r)
                  pa=POPSRegressionEllipse(random_state=1,pac_bayes=True).fit(X,r)
                  hm,hs,hhi,hlo=hy.predict(Xs,return_std=True,return_bounds=True)
                  em,ehi,elo=el.predict(Xs,return_bounds=True)
                  eqlo,eqhi=burgers.bare_percentile_interval(el,Xs)
                  pm,phi,plo,pbsd=pa.predict(Xs,return_bounds=True,return_bound_std=True)
                  pqlo,pqhi=burgers.pac_percentile_interval(pa,Xs)
                  _,_,thhi,thlo=hy.predict(Xt,return_std=True,return_bounds=True)
                  _,tehi,telo=el.predict(Xt,return_bounds=True)
                  _,tphi,tplo,tpbsd=pa.predict(Xt,return_bounds=True,return_bound_std=True)
                  bw=(tphi-tplo)-4*tpbsd; ok=bw>1e-12
                  pacplus=np.mean((tphi[ok]-tplo[ok])/bw[ok]-1)
                  print(f'N={n:2d} rows={len(r):3d} rows/P={len(r)/X.shape[1]:5.2f} '
                        f'slice95 H/E/P={cov(target,hm-2*hs,hm+2*hs):.2f}/{cov(target,eqlo,eqhi):.2f}/{cov(target,pqlo,pqhi):.2f} '
                        f'sliceMAX H/E/P={cov(target,hlo,hhi):.2f}/{cov(target,elo,ehi):.2f}/{cov(target,plo,phi):.2f} '
                        f'testMAX H/E/P={cov(rt,thlo,thhi):.3f}/{cov(rt,telo,tehi):.3f}/{cov(rt,tplo,tphi):.3f} '
                        f'PAC+={100*pacplus:.1f}% widths={np.mean(hhi-hlo):.3f}/{np.mean(ehi-elo):.3f}/{np.mean(phi-plo):.3f}')
          PY
