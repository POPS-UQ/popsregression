name: temp-pod-m3-late-figure
on:
  push:
    paths:
      - '.github/workflows/temp-pod-m3-late-figure.yml'
permissions:
  contents: write
jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . matplotlib
      - name: Generate figure
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY' | tee m3_late_output.txt
          import sys, os
          sys.path.insert(0,'examples')
          import example_burgers_pod as ep
          theta=(0.019833772661901228,1.2585841503444952,0.3893978012340727)
          original=ep.slice_design
          ep.slice_design=lambda _theta,modes,mean_field: original(theta,modes,mean_field)
          ep.run(points_per_case=3,spatial_seed=4432,n_test_cases=120,test_seed=27182)
          old='example_burgers_pod_randomx_r2_m3_s4432'
          new='example_burgers_pod_m3_late_validation'
          os.rename(old+'.png',new+'.png')
          os.rename(old+'.pdf',new+'.pdf')
          print('DISPLAY_THETA',theta)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: burgers-pod-m3-late-validation
          path: |
            example_burgers_pod_m3_late_validation.png
            example_burgers_pod_m3_late_validation.pdf
            m3_late_output.txt
      - name: Record run id
        run: echo '${{ github.run_id }}' > examples/m3_late_run_id.txt
      - name: Commit run id
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/m3_late_run_id.txt
          git commit -m 'temp: record late m3 artifact run id' || exit 0
          git push
