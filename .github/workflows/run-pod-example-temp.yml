name: temp-run-pod-example
on:
  push:
    paths:
      - '.github/workflows/run-pod-example-temp.yml'
jobs:
  run-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . matplotlib
      - name: Run POD Burgers example
        env:
          MPLBACKEND: Agg
        run: |
          python examples/example_burgers_pod.py | tee pod_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pod-example-output
          path: |
            pod_output.txt
            example_burgers_pod_r2.png
          if-no-files-found: error
