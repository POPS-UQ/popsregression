[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "popsregression"
dynamic = ["version"]
authors = [
  { name="Thomas D Swinburne", email="tswin@umich.edu" },
  { name="Danny Perez", email="danny_perez@lanl.gov" },
]
description = "Bayesian regression for low-noise data with misspecification uncertainty (POPS algorithm)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "scikit-learn>=1.6.1",
  "scipy>=1.6.0",
  "numpy>=1.20.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/POPS-UQ/popsregression"
Issues = "https://github.com/POPS-UQ/popsregression/issues"

[tool.setuptools]
py-modules = ["POPSRegression"]

[tool.setuptools.packages.find]
include = ["popsregression*"]

[tool.setuptools_scm]
version_file = "popsregression/_version.py"

[dependency-groups]
# Keep the pinned versions aligned with `.pre-commit-config.yaml`.
lint = [
  "black==23.3.0",
  "ruff==0.4.2",
]
test = [
  "pytest",
  "pytest-cov",
]
doc = [
  "black",  # used by mkdocstrings to format rendered signatures
  "mkdocs-material",
  "mkdocstrings[python]",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "doc" },
]

[tool.black]
line-length = 88
target_version = ['py38', 'py39', 'py310']
preview = true
exclude = '''
/(
    \.eggs         # exclude a few common directories in the
  | \.git          # root of the project
  | \.vscode
)/
'''
force-exclude = "popsregression/_version.py"

[tool.ruff]
# max line length for black
line-length = 88
target-version = "py38"
exclude=[
    ".git",
    "__pycache__",
    "dist",
    "site",
    "build",
    "popsregression/_version.py",
]

[tool.ruff.lint]
# all rules can be found here: https://beta.ruff.rs/docs/rules/
select = ["E", "F", "W", "I"]
ignore=[
    # space before : (needed for how black formats slicing)
    "E203",
    # do not assign a lambda expression, use a def
    "E731",
    # do not use variables named 'l', 'O', or 'I'
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# It's fine not to put the import at the top of the file in the examples
# folder.
"examples/*"=["E402"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --color=yes"
doctest_optionflags = "NORMALIZE_WHITESPACE"

[project.optional-dependencies]
examples = [
    "matplotlib",
]
