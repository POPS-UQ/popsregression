site_name: popsregression
site_description: >-
  API reference and usage documentation for popsregression, the Python
  implementation of the POPS algorithm.
site_url: https://POPS-UQ.github.io/popsregression
repo_url: https://github.com/POPS-UQ/popsregression
repo_name: POPS-UQ/popsregression
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Usage: usage.md
  - API reference: api.md
  - "Example: POPS vs BayesianRidge": example.md
  - "Ellipsoid posteriors": ellipse.md
  - POPS method site: https://pops-uq.github.io/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
